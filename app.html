<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KONE ERP</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app">

    <aside class="sidebar">
      <h2>KONE ERP</h2>

      <button onclick="loadDashboard()">Dashboard</button>
      <button onclick="loadFabricPage()">Fabric Purchase</button>
      <button onclick="loadCuttingPage()">Cutting</button>
      <button onclick="loadStitchingPage()">Stitching</button>
      <button onclick="loadFinishedPage()">Finished</button>
      <button onclick="loadSalesPage()">Sales</button>
      <button onclick="loadReturnPage()">Returns</button>

      <hr>

      <button onclick="clearAll()">Clear Data</button>
    </aside>

    <main id="content"></main>

  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/fabric.js"></script>
  <script src="../js/cutting.js"></script>
  <script src="../js/stitching.js"></script>
  <script src="../js/finished.js"></script>
  <script src="../js/sales.js"></script>
  <script src="../js/return.js"></script>
  <script src="../js/main.js"></script>

  <script>
    window.onload = function () {
      if (typeof setupKeyboard === "function") {
        setupKeyboard();
      }

      if (typeof loadDashboard === "function") {
        loadDashboard();
      }
    };
  </script>

</body>
</html>
